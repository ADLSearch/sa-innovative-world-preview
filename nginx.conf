server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  # Preview host: keep it out of search engines (remove on the real domain)
  add_header X-Robots-Tag "noindex, nofollow" always;
  error_page 404 /404.html;
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }
  location = /apply  { return 302 https://siw.mycarsonline.com/apply-online/; }
  location = /finder { return 302 https://siw.mycarsonline.com/car-finder/; }
  location = /live   { return 302 https://siw.mycarsonline.com/inventory/; }
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}
